<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Staff & Officials Login — Barangay Wawa</title>
  <meta name="description" content="Secure administrative login for Barangay Wawa officials and records management personnel.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px 20px;
      position: relative;
    }
    .auth-card {
      width: min(460px, 100%);
      padding: 38px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header .seal {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
    }
    .auth-header .seal svg {
      width: 32px;
      height: 32px;
    }
    .auth-header h2 {
      font-size: 1.65rem;
      margin-bottom: 6px;
    }
    .demo-accounts {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
    }
    .demo-accounts span {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .demo-btn {
      padding: 8px 6px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--text-soft);
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .demo-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--text);
    }
  </style>
</head>
<body class="auth-page">

  <div class="glass card auth-card">
    <div class="auth-header">
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/><path d="M12 2v3"/>
        </svg>
      </div>
      <h2>Staff & Officials Portal</h2>
      <p class="muted" style="font-size: 0.88rem;">Barangay Wawa, Abra de Ilog, Occidental Mindoro</p>
    </div>

    <form id="adminLoginForm" style="display: grid; gap: 18px;">
      <div class="field">
        <label for="username">Staff Username</label>
        <input type="text" id="username" class="input" placeholder="e.g. secretary or captain" required autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" class="input" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLoginSubmit" style="margin-top: 6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Sign In to Portal
      </button>
    </form>

    <div class="demo-accounts">
      <span>Quick Demo Login (Evaluator Autofill):</span>
      <div class="demo-grid">
        <button type="button" class="demo-btn" data-user="secretary" data-pass="secretary123">
          <b>Secretary</b><br>
          <span style="font-size:0.68rem; color:var(--muted);">L. Fernandez</span>
        </button>
        <button type="button" class="demo-btn" data-user="captain" data-pass="captain123">
          <b>Punong Brgy</b><br>
          <span style="font-size:0.68rem; color:var(--muted);">R. Malabanan</span>
        </button>
        <button type="button" class="demo-btn" data-user="admin" data-pass="admin123">
          <b>Admin</b><br>
          <span style="font-size:0.68rem; color:var(--muted);">System</span>
        </button>
      </div>
    </div>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 0.82rem;">
      <a href="index.html" class="muted" style="text-decoration: underline;">← Back to Public Website</a>
      <a href="resident-login.html" style="color: var(--primary); font-weight: 500;">Resident Portal →</a>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to admin.html
      const cur = BDRMS.currentUser();
      if (cur) {
        window.location.href = 'admin.html';
      }

      // Demo quick fill buttons
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('username').value = btn.getAttribute('data-user');
          document.getElementById('password').value = btn.getAttribute('data-pass');
          document.getElementById('btnLoginSubmit').focus();
        });
      });

      // Handle login form submission
      document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;

        const user = BDRMS.login(u, p);
        if (user) {
          BDRMS.toast(`Welcome back, ${user.name}! Redirecting...`, 'success');
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 600);
        } else {
          BDRMS.toast('Invalid staff username or password.', 'error');
        }
      });
    });
  </script>
</body>
</html>
