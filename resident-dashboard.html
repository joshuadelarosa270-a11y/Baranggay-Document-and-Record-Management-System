<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Dashboard — Barangay Wawa E-Services</title>
  <meta name="description" content="Personal document management dashboard para sa mga rehistradong residente ng Barangay Wawa, Abra de Ilog, Occidental Mindoro.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/print.css">
  <link rel="stylesheet" href="/css/resident.css">
</head>
<body class="hidden">
  <header class="resident-topbar">
    <div class="container resident-topbar-inner">
      <a href="index.html" class="brand">
        <span class="resident-brand-icon" id="residentBrandIcon"></span>
        <span class="brand-text"><strong>Barangay Wawa</strong><span>Portal ng Residente</span></span>
      </a>
      <button type="button" class="btn btn-ghost btn-sm" id="btnResidentLogout">Mag-logout</button>
    </div>
  </header>

  <main class="container resident-workspace">
    <section class="resident-intro" aria-labelledby="dashName">
      <div class="resident-identity">
        <span class="resident-avatar" id="dashAvatar" aria-hidden="true"></span>
        <div>
          <h1 id="dashName"></h1>
          <p><span id="dashPurok"></span> <span class="resident-verified">Aktibo sa rehistro</span></p>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="btnOpenNewRequestModal">Bagong request</button>
    </section>

    <div class="resident-tabs" role="group" aria-label="Mga seksyon ng portal">
      <button type="button" class="active" id="tabMyRequests" aria-controls="paneMyRequests" aria-pressed="true">Mga request</button>
      <button type="button" id="tabProfileDetails" aria-controls="paneProfile" aria-pressed="false">Profile</button>
    </div>

    <section id="paneMyRequests" aria-labelledby="residentRequestsTitle">
      <div class="resident-metrics" aria-label="Buod ng request">
        <div><span>Lahat</span><strong id="dashTotalCount">0</strong></div>
        <div><span>Sinusuri</span><strong id="dashPendingCount">0</strong></div>
        <div><span>Handa nang kunin</span><strong id="dashReadyCount">0</strong></div>
        <div><span>Na-release</span><strong id="dashReleasedCount">0</strong></div>
      </div>
      <div class="resident-panel">
        <div class="resident-panel-head">
          <h2 id="residentRequestsTitle">Aking mga dokumento</h2>
          <div class="resident-filters">
            <input type="search" class="input" id="residentRequestSearch" aria-label="Hanapin ang dokumento o reference" placeholder="Dokumento o reference">
            <select class="select" id="residentStatusFilter" aria-label="Katayuan ng request">
              <option value="all">Lahat ng katayuan</option>
              <option value="pending">Sinusuri</option>
              <option value="Ready for Pickup">Handa nang kunin</option>
              <option value="Released">Na-release</option>
              <option value="Rejected">Tinanggihan</option>
            </select>
          </div>
        </div>
        <div id="requestsListContainer"></div>
        <div class="list-pagination" id="residentPager" role="navigation" aria-label="Mga pahina ng request" hidden>
          <span data-page-range aria-live="polite"></span>
          <div class="page-controls" data-page-controls>
            <button type="button" class="btn btn-ghost btn-sm" data-page-step="-1" aria-label="Nakaraang pahina">&lsaquo;</button>
            <span data-page-position></span>
            <button type="button" class="btn btn-ghost btn-sm" data-page-step="1" aria-label="Susunod na pahina">&rsaquo;</button>
          </div>
        </div>
      </div>
    </section>

    <section id="paneProfile" class="resident-panel hidden" aria-labelledby="residentProfileTitle">
      <div class="resident-panel-head"><h2 id="residentProfileTitle">Aking impormasyon</h2></div>
      <dl class="resident-profile-grid" id="profileDetailsList"></dl>
    </section>
  </main>

  <script src="/js/supabase-config.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/cloud.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
  try { await BDRMS.ready; } catch (error) { BDRMS.reportError(error); return; }
      const requestedDoc = new URLSearchParams(window.location.search).get('apply');
      const applyDocKey = Object.hasOwn(BDRMS.DOC_TYPES, requestedDoc) ? requestedDoc : '';
      const loginURL = applyDocKey ? 'resident-login.html?from=apply&doc=' + encodeURIComponent(applyDocKey) : 'resident-login.html';
      const resident = BDRMS.currentResident();
      if (!resident) {
        window.location.replace(loginURL);
        return;
      }

      initResidentDashboard(resident);
      document.body.classList.remove('hidden');
      if (applyDocKey) openResidentApplyModal(resident, applyDocKey);

      function checkSession() {
        if (BDRMS.currentResident()?.id === resident.id) return;
        document.body.classList.add('hidden');
        window.location.replace(loginURL);
      }

      window.addEventListener('pageshow', checkSession);
      document.addEventListener('bdrms:sync', () => {
        checkSession();
        if (!document.body.classList.contains('hidden')) renderResidentRequests(resident);
      });
    });

    function initResidentDashboard(resident) {
      document.getElementById('residentBrandIcon').innerHTML = BDRMS.ICONS.seal;
      document.getElementById('dashAvatar').textContent = resident.firstName.charAt(0);
      document.getElementById('dashName').textContent = BDRMS.fullName(resident);
      document.getElementById('dashPurok').textContent = resident.purok + ', Barangay Wawa';
      renderProfileDetails(resident);

      const render = () => renderResidentRequests(resident);
      BDRMSUI.mountPagination('residentPager', 6, render);
      render();
      const updateFilter = () => {
        BDRMSUI.resetPage('residentPager');
        render();
      };
      document.getElementById('residentRequestSearch').addEventListener('input', updateFilter);
      document.getElementById('residentStatusFilter').addEventListener('change', updateFilter);
      document.getElementById('requestsListContainer').addEventListener('click', event => {
        const item = event.target.closest('[data-resident-request]');
        if (item) showResidentTimeline(item.dataset.residentRequest);
      });

      document.getElementById('btnResidentLogout').addEventListener('click', () => {
        BDRMS.confirmDialog({
          title: 'Mag-logout?',
          message: 'Kailangan mong mag-login muli para makita ang iyong mga request.',
          confirmText: 'Mag-logout',
          onConfirm: async () => {
            await BDRMS.logoutResident();
            window.location.replace('resident-login.html');
          },
        });
      });

      const tabs = [document.getElementById('tabMyRequests'), document.getElementById('tabProfileDetails')];
      tabs.forEach(tab => tab.addEventListener('click', () => {
        tabs.forEach(item => {
          const active = tab === item;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
          document.getElementById(item.getAttribute('aria-controls')).classList.toggle('hidden', !active);
        });
      }));

      document.getElementById('btnOpenNewRequestModal').addEventListener('click', () => openResidentApplyModal(resident));
    }

    function belongsToResident(request, resident) {
      if (request.residentId) return request.residentId === resident.id;
      return !!request.applicant.birthdate && BDRMS.findResidentMatch(request.applicant)?.id === resident.id;
    }

    function findResidentRequest(id) {
      const resident = BDRMS.currentResident();
      if (!resident) return null;
      return BDRMS.data().requests.find(request => request.id === id && belongsToResident(request, resident));
    }

    const isPendingRequest = request => ['Submitted', 'Under Verification', 'For Approval'].includes(request.status);

    function renderResidentRequests(resident) {
      const container = document.getElementById('requestsListContainer');
      const requests = BDRMS.data().requests.filter(request => belongsToResident(request, resident))
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      document.getElementById('dashTotalCount').textContent = requests.length;
      document.getElementById('dashPendingCount').textContent = requests.filter(isPendingRequest).length;
      document.getElementById('dashReadyCount').textContent = requests.filter(request => request.status === 'Ready for Pickup').length;
      document.getElementById('dashReleasedCount').textContent = requests.filter(request => request.status === 'Released').length;

      const status = document.getElementById('residentStatusFilter').value;
      const query = document.getElementById('residentRequestSearch').value.trim().toLowerCase();
      const filtered = requests.filter(request => {
        const name = BDRMS.DOC_TYPES[request.docType]?.name || request.docType;
        return (status === 'all' || (status === 'pending' ? isPendingRequest(request) : request.status === status)) &&
          (!query || name.toLowerCase().includes(query) || request.ref.toLowerCase().includes(query));
      });
      const visible = BDRMSUI.page('residentPager', filtered);
      if (!visible.length) {
        container.innerHTML = '<p class="resident-empty">' +
          (requests.length ? 'Walang request na tugma sa paghahanap.' : 'Wala ka pang naipapasang request.') + '</p>';
        return;
      }

      container.innerHTML = visible.map(request => {
        const doc = BDRMS.DOC_TYPES[request.docType];
        return `
          <article class="resident-request">
            ${doc ? BDRMS.docIcon(request.docType) : ''}
            <div class="resident-request-title">
              <h3>${BDRMS.esc(doc?.name || request.docType)}</h3>
              <p><span class="mono">${BDRMS.esc(request.ref)}</span> <span>${BDRMS.fmtDate(request.createdAt)}</span></p>
            </div>
            ${BDRMS.statusBadge(request.status)}
            <button type="button" class="btn btn-ghost btn-sm" data-resident-request="${BDRMS.esc(request.id)}">Tingnan</button>
          </article>`;
      }).join('');
    }

    function renderProfileDetails(resident) {
      const profile = [
        ['Buong pangalan', BDRMS.fullName(resident)],
        ['Username', resident.username],
        ['Petsa ng kapanganakan', BDRMS.fmtDateLong(resident.birthdate)],
        ['Mobile number', resident.contact],
        ['Tirahan', resident.address],
        ['Tagal ng paninirahan', BDRMS.residencyText(resident.residentSince)],
        ['Kasarian', resident.sex],
        ['Katayuang sibil', resident.civilStatus],
        ['Inaprubahan ni', resident.registeredBy || 'Tanggapan ng Kalihim'],
      ];
      document.getElementById('profileDetailsList').innerHTML = profile.map(([label, value]) =>
        `<div><dt>${label}</dt><dd>${BDRMS.esc(value || '—')}</dd></div>`
      ).join('');
    }

    function openResidentApplyModal(resident, preselectedDocKey) {
      BDRMS.modal({
        title: 'Bagong request',
        subtitle: BDRMS.esc(BDRMS.fullName(resident) + ' · ' + resident.purok),
        body: `
          <form id="formQuickApply" class="form-grid">
            <div class="field span-2">
              <label for="qaDocType">Dokumento</label>
              <select id="qaDocType" class="select">
                ${Object.entries(BDRMS.DOC_TYPES).map(([k, d]) => `<option value="${k}" ${k === preselectedDocKey ? 'selected' : ''}>${d.name} (${d.fee})</option>`).join('')}
              </select>
            </div>

            <p class="resident-form-note span-2" id="qaSummary" aria-live="polite"></p>
            <div class="field span-2">
              <label for="qaPurpose">Layunin</label>
              <input type="text" id="qaPurpose" class="input" placeholder="Hal. Pag-aapply sa trabaho" required>
            </div>

            <div class="field">
              <label for="qaIdType">Uri ng valid ID</label>
              <select id="qaIdType" class="select">
                ${BDRMS.ID_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}
              </select>
            </div>

            <div class="field">
              <label for="qaIdNumber">Numero ng ID</label>
              <input type="text" id="qaIdNumber" class="input" placeholder="hal. 1234-5678-9012" required>
            </div>

            <div id="qaExtra" class="form-grid span-2" hidden></div>
          </form>
        `,
        foot: `
          <button type="button" class="btn btn-ghost" data-close>Kanselahin</button>
          <button type="submit" form="formQuickApply" class="btn btn-primary">Isumite ang request</button>
        `,
        onMount: (modalEl, closeFn) => {
          const form = modalEl.querySelector('form');
          const type = modalEl.querySelector('#qaDocType');
          const extraFields = modalEl.querySelector('#qaExtra');
          function updateDocument() {
            const doc = BDRMS.DOC_TYPES[type.value];
            const shortResidency = doc.residency && BDRMS.monthsBetween(resident.residentSince) < BDRMS.RESIDENCY_MONTHS;
            modalEl.querySelector('#qaSummary').textContent = [doc.fee, doc.processing,
              shortResidency ? 'Kailangan ng 6 na buwang paninirahan para sa dokumentong ito.' : ''].filter(Boolean).join(' · ');
            extraFields.innerHTML = (doc.extra || []).map(field => `
              <div class="field">
                <label for="qa-extra-${field.key}">${BDRMS.esc(field.label)}</label>
                <input id="qa-extra-${field.key}" class="input" placeholder="${BDRMS.esc(field.placeholder || '')}" ${field.required ? 'required' : ''}>
              </div>`).join('');
            extraFields.hidden = !doc.extra?.length;
          }
          type.addEventListener('change', updateDocument);
          updateDocument();
          form.addEventListener('submit', async event => {
            event.preventDefault();
            const docType = type.value;
            const purpose = modalEl.querySelector('#qaPurpose').value.trim();
            const idType = modalEl.querySelector('#qaIdType').value;
            const idNumber = modalEl.querySelector('#qaIdNumber').value.trim();

            const fields = BDRMS.DOC_TYPES[docType].extra || [];
            const extra = Object.fromEntries(fields.map(field => [field.key, modalEl.querySelector('#qa-extra-' + field.key).value.trim()]));
            if (!purpose || !idNumber || fields.some(field => field.required && !extra[field.key])) {
              BDRMS.toast('Pakipunan ang lahat ng kinakailangang field.', 'error');
              return;
            }

            const applicant = {
              firstName: resident.firstName,
              middleName: resident.middleName,
              lastName: resident.lastName,
              suffix: resident.suffix,
              birthdate: resident.birthdate,
              sex: resident.sex,
              civilStatus: resident.civilStatus,
              purok: resident.purok,
              contact: resident.contact,
              email: resident.email,
              residentSince: resident.residentSince,
            };

            try {
            const req = await BDRMS.createRequest({
              applicant,
              docType,
              purpose,
              extra,
              idType,
              idNumber,
              channel: 'Online',
              by: `${resident.firstName} (Resident Portal)`,
              residentId: resident.id,
            });

            BDRMS.toast(`Matagumpay na naipadala ang request! Reference: ${req.ref}`, 'success');
            closeFn();
            document.getElementById('tabMyRequests').click();
            document.getElementById('residentRequestSearch').value = '';
            document.getElementById('residentStatusFilter').value = 'all';
            BDRMSUI.resetPage('residentPager');
            renderResidentRequests(resident);
            } catch (error) { BDRMS.toast(error.message, 'error'); }
          });
        },
      });
    }

    window.showResidentCertificate = function(reqId) {
      const req = findResidentRequest(reqId);
      if (!req || !['Ready for Pickup', 'Released'].includes(req.status)) return;

      BDRMS.modal({
        title: 'Opisyal na Dokumento — Barangay Wawa',
        subtitle: `${BDRMS.DOC_TYPES[req.docType].name} (Para sa Pag-print)`,
        wide: true,
        body: BDRMS.certificateHTML(req),
        foot: `
          <button class="btn btn-ghost" data-close>Isara</button>
          <button class="btn btn-primary" onclick="window.print()">${BDRMS.ICONS.printer} I-print ang Dokumento</button>
        `,
      });
    };

    window.showResidentClaimStub = function(reqId) {
      const req = findResidentRequest(reqId);
      if (!req) return;
      const doc = BDRMS.DOC_TYPES[req.docType];
      const qrSvg = BDRMS.generateQRCodeSVG(`BDRMS:${req.ref}:${req.applicant.lastName}`, 120);

      BDRMS.modal({
        title: 'Claim Stub / Katibayan sa Pag-apply',
        subtitle: `Reference: ${req.ref}`,
        body: `
          <div class="printable-claim" style="border: 2px dashed #94a3b8; border-radius: 12px; padding: 20px; background: #ffffff; color: #0f172a; max-width: 540px; margin: 0 auto;">
            <div style="text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 16px;">
              <h3 style="font-size: 1.25rem;">BARANGAY WAWA</h3>
              <p style="font-size: 0.82rem; color: #475569;">Abra de Ilog, Occidental Mindoro</p>
              <h4 style="font-size: 0.95rem; margin-top: 4px; color: #059669;">KATIBAYAN SA PAG-APPLY</h4>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;">
              <div>
                <span style="font-size: 0.74rem; text-transform: uppercase; color: #64748b; font-weight: 600;">Reference Code:</span>
                <div class="mono" style="font-size: 1.4rem; font-weight: 800; color: #059669;">${req.ref}</div>
                <span style="font-size: 0.8rem; color: #64748b;">Petsa: ${BDRMS.fmtDateTime(req.createdAt)}</span>
              </div>
              <div>${qrSvg}</div>
            </div>

            <div style="display: grid; gap: 6px; font-size: 0.88rem; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
              <div><b>Aplikante:</b> ${BDRMS.esc(BDRMS.fullName(req.applicant))}</div>
              <div><b>Dokumento:</b> ${BDRMS.esc(doc.name)}</div>
              <div><b>Bayad:</b> ${doc.fee} (${req.paymentStatus || 'Unpaid'})</div>
              <div><b>Ipakikitang ID:</b> ${BDRMS.esc(req.idType)}</div>
            </div>

            <div style="margin-top: 14px; font-size: 0.8rem; color: #475569; border-top: 1px dashed #cbd5e1; padding-top: 10px;">
              Dalhin ang claim stub na ito at orihinal na Valid ID sa Barangay Hall sa araw ng pagkuha (Lunes–Biyernes, 8am–5pm).
            </div>
          </div>
        `,
        foot: `
          <button class="btn btn-ghost" data-close>Isara</button>
          <button class="btn btn-primary" onclick="window.print()">${BDRMS.ICONS.printer} I-print ang Claim Stub</button>
        `,
      });
    };

    window.showResidentTimeline = function(reqId) {
      const req = findResidentRequest(reqId);
      if (!req) return;

      const printable = ['Ready for Pickup', 'Released'].includes(req.status);
      BDRMS.modal({
        title: BDRMS.esc(BDRMS.DOC_TYPES[req.docType]?.name || req.docType),
        subtitle: BDRMS.esc(req.ref),
        body: `
          <div style="margin-bottom: 16px; display:flex; align-items:center; gap:8px;">
            ${BDRMS.statusBadge(req.status)}
            <span style="font-size:0.85rem; color:var(--text-muted);">${BDRMS.STATUSES[req.status]?.desc || ''}</span>
          </div>
          <div class="timeline">
            ${req.history.map(h => `
              <div class="tl-item done" style="padding-bottom:14px;">
                <div class="tl-dot" style="width:32px; height:32px;">${BDRMS.ICONS.check}</div>
                <div class="tl-body">
                  <strong style="font-size:0.88rem;">${h.status}</strong>
                  <span style="font-size:0.75rem;">${BDRMS.fmtDateTime(h.at)} • ni ${h.by}</span>
                  ${h.note ? `<p style="font-size:0.8rem; color:var(--text-soft);">${BDRMS.esc(h.note)}</p>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `,
        foot: `
          <button type="button" class="btn btn-ghost" data-close>Isara</button>
          <button type="button" class="btn btn-ghost" data-claim>Claim stub</button>
          ${printable ? '<button type="button" class="btn btn-primary" data-certificate>Sertipiko</button>' : ''}
        `,
        onMount: dialog => {
          dialog.querySelector('[data-claim]').addEventListener('click', () => showResidentClaimStub(reqId));
          dialog.querySelector('[data-certificate]')?.addEventListener('click', () => showResidentCertificate(reqId));
        },
      });
    };
  </script>
</body>
</html>
